name: Government feed connectivity check

on:
  push:
    branches: [ops/feed-connectivity-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check official API without a key
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import socket
          import urllib.error
          import urllib.request

          targets = {
              "government_api": "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?format=json&limit=1",
              "control": "https://example.com/",
          }
          results = {}
          for label, url in targets.items():
              request = urllib.request.Request(url, headers={
                  "User-Agent": "HarvestShield/1.0", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      results[label] = {"http_reached": True, "status": response.status}
              except urllib.error.HTTPError as error:
                  results[label] = {"http_reached": True, "status": error.code}
                  error.close()
              except Exception as error:
                  reason = getattr(error, "reason", error)
                  results[label] = {"http_reached": False,
                      "error_type": type(reason).__name__, "errno": getattr(reason, "errno", None)}
          print(json.dumps(results, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Credential-free API connectivity\n\n```json\n" + json.dumps(results, indent=2) + "\n```\n")
              summary.write("No API key was used. HTTP reachability alone does not prove authentication or valid market data.\n")
          if not results["government_api"]["http_reached"]:
              raise SystemExit("Official API could not be reached from this runner.")
          PY
