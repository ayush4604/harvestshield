services:
  backend:
    build: .
    image: harvestshield:1.1.0
    command: ["python", "-m", "deployment.bootstrap", "api"]
    restart: unless-stopped
    environment:
      HARVESTSHIELD_ENV: production
      HARVESTSHIELD_READ_ONLY: "true"
      HARVESTSHIELD_DATA_DIR: /state/data
      HARVESTSHIELD_ALLOWED_HOSTS: backend,localhost,127.0.0.1
      DATA_GOV_API_KEY: ${DATA_GOV_API_KEY:-}
    volumes:
      - harvest-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  frontend:
    image: harvestshield:1.1.0
    command: ["python", "-m", "deployment.bootstrap", "ui"]
    restart: unless-stopped
    environment:
      HARVESTSHIELD_ENV: production
      HARVESTSHIELD_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:${HARVESTSHIELD_PORT:-8501}:8501"
    depends_on:
      backend: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  harvest-state:
